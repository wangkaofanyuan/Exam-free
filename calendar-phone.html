<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>115學年度 國三重大行事曆</title>
<style>
  :root{
    --bg:#0b1020;
    --panel:#131a2c;
    --panel-2:#1a2338;
    --line:#263049;
    --ink:#f5f7fb;
    --ink-dim:#a7b0c8;
    --ink-faint:#6b7591;

    --c-mock:#4da3ff;
    --c-mock-bg:rgba(77,163,255,0.14);
    --c-exam:#b291ff;
    --c-exam-bg:rgba(178,145,255,0.14);
    --c-final:#ff6b7d;
    --c-final-bg:rgba(255,107,125,0.16);
    --c-school:#39d9a4;
    --c-school-bg:rgba(57,217,164,0.14);
    --c-admin:#ffbb4d;
    --c-admin-bg:rgba(255,187,77,0.14);

    --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body{padding-bottom:calc(24px + var(--safe-bottom));}
  a{color:inherit;}

  /* ============ 頂部固定列 ============ */
  .app-header{
    position:sticky;top:0;z-index:50;
    padding:calc(12px + var(--safe-top)) 16px 12px 16px;
    background:linear-gradient(180deg,rgba(11,16,32,0.98),rgba(11,16,32,0.9));
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .app-header .h-top{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .app-header .h-title{
    font-size:16px;font-weight:900;letter-spacing:0.2px;
  }
  .app-header .h-date{
    font-size:12px;color:var(--ink-dim);font-weight:600;white-space:nowrap;
  }
  .app-header .h-sub{
    margin-top:2px;font-size:11px;color:var(--ink-faint);font-weight:600;
  }

  main{padding:14px 16px 0 16px;display:flex;flex-direction:column;gap:16px;}

  .section-title{
    font-size:13px;font-weight:900;color:var(--ink-dim);
    letter-spacing:1.5px;margin:0 0 10px 2px;
    display:flex;align-items:center;gap:6px;
  }

  /* ============ 會考倒數 + NEXT UP ============ */
  .hero-final{
    background:radial-gradient(circle at 20% 0%, rgba(255,107,125,0.22), transparent 60%), var(--panel);
    border:1px solid var(--c-final);
    border-radius:16px;
    padding:16px 18px;
    display:flex;align-items:center;gap:14px;
  }
  .hero-final .hf-left{flex:1;min-width:0;}
  .hero-final .hf-tag{font-size:11px;font-weight:900;letter-spacing:3px;color:var(--c-final);}
  .hero-final .hf-date{font-size:12px;color:var(--ink-dim);font-weight:600;margin-top:2px;}
  .hero-final .hf-num{
    flex:0 0 auto;text-align:right;
  }
  .hero-final .hf-num .n{font-size:38px;font-weight:900;color:#fff;line-height:1;text-shadow:0 0 18px rgba(255,107,125,0.5);}
  .hero-final .hf-num .u{font-size:12px;font-weight:800;color:var(--c-final);}

  .hero-next{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--c-mock);
    border-radius:16px;
    padding:16px 18px;
    display:flex;flex-direction:column;gap:6px;
  }
  .hero-next .hn-eyebrow{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--c-mock);}
  .hero-next .hn-title{font-size:19px;font-weight:900;color:var(--ink);line-height:1.35;}
  .hero-next .hn-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--ink-dim);font-weight:600;}
  .hero-next .hn-badge{
    width:fit-content;padding:3px 10px;border-radius:999px;
    font-size:11px;font-weight:800;
  }
  .hero-next .hn-count{font-size:15px;font-weight:900;color:var(--c-mock);margin-top:2px;}

  /* ============ 進度條 ============ */
  .progress-card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:14px 18px;
  }
  .progress-card .pc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .progress-card .pc-label{font-size:12px;font-weight:800;color:var(--ink-dim);}
  .progress-card .pc-pct{font-size:14px;font-weight:900;color:var(--ink);}
  .progress-track{height:10px;background:var(--panel-2);border-radius:999px;overflow:hidden;border:1px solid var(--line);}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--c-mock),var(--c-exam));border-radius:999px;}

  /* ============ 接下來（橫向捲動） ============ */
  .hscroll{
    display:flex;gap:10px;overflow-x:auto;
    padding:2px 2px 8px 2px;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .hscroll::-webkit-scrollbar{display:none;}
  .up-card{
    flex:0 0 auto;width:150px;
    background:var(--panel);border:1px solid var(--line);
    border-top:4px solid var(--ink-faint);
    border-radius:14px;padding:12px 14px;
    scroll-snap-align:start;
    display:flex;flex-direction:column;justify-content:space-between;gap:8px;
    min-height:118px;
  }
  .up-card.cat-mock{border-top-color:var(--c-mock);}
  .up-card.cat-examMid{border-top-color:var(--c-exam);}
  .up-card.cat-final{border-top-color:var(--c-final);background:var(--c-final-bg);}
  .up-card.cat-school{border-top-color:var(--c-school);}
  .up-card.cat-admin{border-top-color:var(--c-admin);}
  .up-card .up-date{font-size:16px;font-weight:900;color:var(--ink);}
  .up-card .up-week{font-size:11px;color:var(--ink-faint);font-weight:700;}
  .up-card .up-title{font-size:13px;font-weight:800;color:var(--ink);line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .up-card .up-dday{font-size:11px;font-weight:900;color:var(--c-mock);}

  /* ============ 篩選 chips（sticky） ============ */
  .filter-sticky{
    position:sticky;top:calc(64px + var(--safe-top));z-index:40;
    background:var(--bg);
    padding:6px 0 4px 0;
    margin:0 -16px;
  }
  .filter-scroll{
    display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px 16px;
    -webkit-overflow-scrolling:touch;
  }
  .filter-scroll::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    appearance:none;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-dim);
    font-family:var(--font);
    padding:7px 16px;border-radius:999px;
    font-size:13px;font-weight:700;
  }
  .chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  /* ============ 時間軸 ============ */
  .today-jump{
    display:flex;justify-content:flex-end;
  }
  .today-jump button{
    appearance:none;border:1px solid var(--c-mock);
    background:var(--c-mock-bg);color:var(--c-mock);
    font-family:var(--font);font-weight:800;font-size:12px;
    padding:6px 14px;border-radius:999px;
  }

  .month-block{margin-bottom:6px;}
  .month-block h3{
    font-size:16px;font-weight:900;color:var(--ink);
    margin:18px 0 10px 2px;
    display:flex;align-items:baseline;gap:6px;
  }
  .month-block h3 .yr{font-size:11px;color:var(--ink-faint);font-weight:700;}

  .now-marker{
    display:flex;align-items:center;gap:10px;margin:8px 0 14px 0;
  }
  .now-marker::before,.now-marker::after{
    content:"";flex:1;height:2px;
    background:repeating-linear-gradient(90deg,var(--c-final) 0 6px, transparent 6px 11px);
  }
  .now-marker .now-tag{
    background:var(--c-final);color:#fff;font-weight:900;font-size:11px;
    padding:5px 14px;border-radius:999px;letter-spacing:1px;white-space:nowrap;
  }

  .ev-item{
    display:flex;gap:12px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin-bottom:9px;
  }
  .ev-item.status-done{opacity:0.4;}
  .ev-item .ev-datebox{
    flex:0 0 52px;text-align:center;
    display:flex;flex-direction:column;justify-content:center;
    border-right:1px solid var(--line);padding-right:10px;
  }
  .ev-item .ev-datebox .d-num{font-size:19px;font-weight:900;color:var(--ink);line-height:1.1;}
  .ev-item .ev-datebox .d-mon{font-size:10px;color:var(--ink-faint);font-weight:700;}
  .ev-item .ev-datebox .d-week{font-size:10px;color:var(--ink-faint);font-weight:700;margin-top:2px;}
  .ev-item .ev-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .ev-item .ev-title{font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.35;}
  .ev-item .ev-sub{font-size:11.5px;color:var(--ink-faint);font-weight:600;}
  .ev-item .ev-foot{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
  .ev-item .ev-cat{
    font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;
  }
  .ev-item .ev-status{font-size:10.5px;font-weight:800;color:var(--ink-faint);}
  .ev-item.cat-mock .ev-cat{background:var(--c-mock-bg);color:var(--c-mock);}
  .ev-item.cat-examMid .ev-cat{background:var(--c-exam-bg);color:var(--c-exam);}
  .ev-item.cat-final .ev-cat{background:var(--c-final-bg);color:var(--c-final);}
  .ev-item.cat-school .ev-cat{background:var(--c-school-bg);color:var(--c-school);}
  .ev-item.cat-admin .ev-cat{background:var(--c-admin-bg);color:var(--c-admin);}
  .ev-item.cat-final{border-color:var(--c-final);}

  /* ============ 考試總表 ============ */
  .exam-group{margin-bottom:4px;}
  .exam-group h4{
    font-size:13px;font-weight:900;color:var(--ink-dim);
    letter-spacing:1px;margin:14px 0 8px 2px;
    display:flex;align-items:center;gap:6px;
  }
  .exam-group h4 .dot{width:8px;height:8px;border-radius:50%;}
  .exam-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .exam-chip{
    flex:1 1 calc(50% - 8px);min-width:140px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;
  }
  .exam-chip.status-done{opacity:0.4;}
  .exam-chip .ec-title{font-size:13px;font-weight:800;color:var(--ink);}
  .exam-chip .ec-date{font-size:12px;color:var(--ink-dim);font-weight:600;margin-top:2px;}

  .final-block{
    background:radial-gradient(circle at 20% 0%, rgba(255,107,125,0.22), transparent 60%), var(--panel);
    border:1px solid var(--c-final);border-radius:16px;
    padding:18px;text-align:center;margin-top:8px;
  }
  .final-block .fb-tag{font-size:11px;font-weight:900;letter-spacing:4px;color:var(--c-final);}
  .final-block .fb-title{font-size:20px;font-weight:900;color:#fff;margin-top:4px;}
  .final-block .fb-date{font-size:13px;color:var(--ink-dim);font-weight:600;margin-top:4px;}

  footer{
    text-align:center;padding:20px 16px 8px 16px;
    font-size:11px;color:var(--ink-faint);font-weight:600;line-height:1.7;
  }

  /* 較大手機 / 直式平板微調 */
  @media (min-width:480px){
    main{padding-left:24px;padding-right:24px;}
    .app-header{padding-left:24px;padding-right:24px;}
    .exam-chip{flex:1 1 calc(33.333% - 8px);}
  }
</style>
</head>
<body>

  <header class="app-header">
    <div class="h-top">
      <div class="h-title">115學年度 國三行事曆</div>
      <div class="h-date" id="header-date">--</div>
    </div>
    <div class="h-sub">陽明國中 ‧ 323班</div>
  </header>

  <main>

    <!-- 會考倒數 -->
    <div class="hero-final">
      <div class="hf-left">
        <div class="hf-tag">距離國中教育會考</div>
        <div class="hf-date">116/5/15（六）～5/16（日）</div>
      </div>
      <div class="hf-num"><span class="n" id="hf-days">--</span><div class="u">天</div></div>
    </div>

    <!-- 下一個重要行程 -->
    <div class="hero-next">
      <div class="hn-eyebrow">NEXT UP ‧ 下一個重要行程</div>
      <div class="hn-title" id="nu-title">--</div>
      <div class="hn-meta">
        <span id="nu-date">--</span>
        <span id="nu-week"></span>
        <span id="nu-time"></span>
      </div>
      <div class="hn-badge" id="nu-badge"></div>
      <div class="hn-count" id="nu-count">--</div>
    </div>

    <!-- 進度條 -->
    <div class="progress-card">
      <div class="pc-row">
        <div class="pc-label">國三備戰進度</div>
        <div class="pc-pct" id="pg-pct">0%</div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="pg-fill" style="width:0%"></div></div>
    </div>

    <!-- 接下來（橫向捲動） -->
    <section>
      <div class="section-title">📍 接下來</div>
      <div class="hscroll" id="up-hscroll"></div>
    </section>

    <!-- 篩選 -->
    <div class="filter-sticky">
      <div class="filter-scroll" id="filter-scroll"></div>
    </div>

    <!-- 完整時間軸 -->
    <section>
      <div class="section-title">🗓 全學年時間軸</div>
      <div class="today-jump"><button id="jump-today-btn">回到目前位置 ↓</button></div>
      <div id="timeline-body"></div>
    </section>

    <!-- 考試總表 -->
    <section>
      <div class="section-title">📝 考試總表</div>

      <div class="exam-group">
        <h4><span class="dot" style="background:var(--c-mock)"></span>五次模擬考</h4>
        <div class="exam-chip-row" id="exam-mock-row"></div>
      </div>

      <div class="exam-group">
        <h4><span class="dot" style="background:var(--c-exam)"></span>第一學期段考</h4>
        <div class="exam-chip-row" id="exam-mid1-row"></div>
      </div>

      <div class="exam-group">
        <h4><span class="dot" style="background:var(--c-exam)"></span>第二學期段考</h4>
        <div class="exam-chip-row" id="exam-mid2-row"></div>
      </div>

      <div class="final-block" id="final-block"></div>
    </section>

  </main>

  <footer>
    115學年度 國三重大行事曆 ‧ 實際行程如有異動，以學校最新公告為準
  </footer>

<script>
/* ======================================================================
   1. EVENT DATA（與其他版本共用同一份正式資料，未新增或刪改任何事件）
   ====================================================================== */
const events = [
  { id:"mock-01", title:"第一次模擬考", start:"2026-09-08", end:"2026-09-09", category:"mock", categoryLabel:"模擬考", importance:4 },
  { id:"mock-02", title:"第二次模擬考", start:"2026-10-28", end:"2026-10-29", category:"mock", categoryLabel:"模擬考", importance:4 },
  { id:"mock-03", title:"第三次模擬考", start:"2026-12-23", end:"2026-12-24", category:"mock", categoryLabel:"模擬考", importance:4 },
  { id:"mock-04", title:"第四次模擬考", start:"2027-02-18", end:"2027-02-19", category:"mock", categoryLabel:"模擬考", importance:4 },
  { id:"mock-05", title:"第五次模擬考", start:"2027-04-15", end:"2027-04-16", category:"mock", categoryLabel:"模擬考", importance:4 },

  { id:"exam-s1-01", title:"第一次段考", start:"2026-10-12", end:"2026-10-13", category:"examMid", categoryLabel:"段考", importance:4 },
  { id:"exam-s1-02", title:"第二次段考", start:"2026-11-23", end:"2026-11-24", category:"examMid", categoryLabel:"段考", importance:4 },
  { id:"exam-s1-03", title:"第三次段考週", start:"2027-01-18", end:"2027-01-19", category:"examMid", categoryLabel:"段考", importance:4 },

  { id:"exam-s2-01", title:"第一次段考週", start:"2027-03-22", end:"2027-03-26", category:"examMid", categoryLabel:"段考", importance:4, noWeekday:true },
  { id:"exam-s2-02", title:"第二次段考週", start:"2027-05-03", end:"2027-05-07", category:"examMid", categoryLabel:"段考", importance:4, noWeekday:true },

  { id:"final-exam", title:"國中教育會考", start:"2027-05-15", end:"2027-05-16", category:"final", categoryLabel:"會考", importance:5 },

  { id:"night-study-start", title:"國三晚自習開始", start:"2026-09-21", end:"2026-09-21", category:"school", categoryLabel:"校務／生活", importance:2 },
  { id:"id-photo", title:"拍攝證件照", start:"2026-09-24", end:"2026-09-24", category:"admin", categoryLabel:"升學／行政", importance:2 },
  { id:"trip-meeting", title:"國三畢旅行前會", start:"2026-10-13", end:"2026-10-13", category:"school", categoryLabel:"活動", importance:3, time:"15:40～16:30" },
  { id:"grad-trip", title:"畢業旅行", start:"2026-10-14", end:"2026-10-16", category:"school", categoryLabel:"活動", importance:3 },
  { id:"anniversary", title:"39週年校慶", start:"2026-11-06", end:"2026-11-06", category:"school", categoryLabel:"校務／活動", importance:2 },
  { id:"group-photo", title:"全校大團拍及各班拍攝團體照", start:"2026-11-30", end:"2026-12-04", category:"school", categoryLabel:"活動", importance:2, noWeekday:true },
  { id:"night-study-end", title:"第八節輔導課結束、國三晚自習結束", start:"2027-01-15", end:"2027-01-15", category:"school", categoryLabel:"校務／生活", importance:2 },
  { id:"winter-tutoring", title:"寒假輔導", start:"2027-01-21", end:"2027-01-29", category:"school", categoryLabel:"校務／生活", importance:3,
    datesList:["2027-01-21","2027-01-22","2027-01-25","2027-01-26","2027-01-27","2027-01-28","2027-01-29"] }
];

const EXAM_TARGET = "2027-05-15";
const PREP_START  = "2026-09-01";
const PREP_END    = "2027-05-15";
const EXAM_CATEGORIES = ["mock","examMid","final"];

/* ======================================================================
   2. DATE UTILITIES
   ====================================================================== */
function pad2(n){ return n < 10 ? "0" + n : "" + n; }
function toDate(str){ const [y,m,d] = str.split("-").map(Number); return new Date(y, m-1, d); }
function todayDate(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function toROCYear(y){ return y - 1911; }
function formatROCDate(dateStr){
  const d = toDate(dateStr);
  return toROCYear(d.getFullYear()) + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日";
}
function formatROCShort(dateStr){
  const d = toDate(dateStr);
  return pad2(d.getMonth()+1) + "/" + pad2(d.getDate());
}
function formatROCDateRange(startStr, endStr){
  if(!endStr || endStr === startStr) return formatROCDate(startStr);
  const s = toDate(startStr), e = toDate(endStr);
  if(s.getFullYear() === e.getFullYear() && s.getMonth() === e.getMonth()){
    return toROCYear(s.getFullYear()) + "年" + (s.getMonth()+1) + "月" + s.getDate() + "日～" + e.getDate() + "日";
  } else if(s.getFullYear() === e.getFullYear()){
    return toROCYear(s.getFullYear()) + "年" + (s.getMonth()+1) + "月" + s.getDate() + "日～" + (e.getMonth()+1) + "月" + e.getDate() + "日";
  } else {
    return formatROCDate(startStr) + "～" + formatROCDate(endStr);
  }
}
const WEEKDAY_NAMES = ["日","一","二","三","四","五","六"];
const WEEKDAY_NAMES_FULL = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function formatWeekdayShort(dateStr){ return "週" + WEEKDAY_NAMES[toDate(dateStr).getDay()]; }
function formatWeekdayFull(dateStr){ return WEEKDAY_NAMES_FULL[toDate(dateStr).getDay()]; }
function calculateDaysRemaining(dateStr){
  return Math.round((toDate(dateStr) - todayDate()) / 86400000);
}

/* ======================================================================
   3. STATUS CALCULATION
   ====================================================================== */
function getEventStatus(ev){
  const today = todayDate();
  const start = toDate(ev.start);
  const end = ev.end ? toDate(ev.end) : start;
  if(today.getTime() > end.getTime()) return "done";
  if(today.getTime() >= start.getTime() && today.getTime() <= end.getTime()){
    return start.getTime() === end.getTime() ? "today" : "ongoing";
  }
  const diffDays = Math.round((start - today) / 86400000);
  if(diffDays === 1) return "tomorrow";
  return "upcoming";
}
function statusLabel(status){
  switch(status){
    case "done": return "已完成";
    case "today": return "TODAY";
    case "tomorrow": return "明天";
    case "ongoing": return "進行中";
    case "upcoming": return "即將到來";
    default: return "";
  }
}
function statusBadgeStyle(status){
  switch(status){
    case "today": return { bg:"#ffffff", fg:"#0b1020" };
    case "tomorrow": return { bg:"var(--c-admin-bg)", fg:"var(--c-admin)" };
    case "ongoing": return { bg:"var(--c-mock-bg)", fg:"var(--c-mock)" };
    default: return { bg:"var(--panel-2)", fg:"var(--ink-dim)" };
  }
}

/* ======================================================================
   4. SORTING
   ====================================================================== */
function sortByStart(list){ return [...list].sort((a,b) => toDate(a.start) - toDate(b.start)); }
function getNotDoneSorted(){ return sortByStart(events.filter(ev => getEventStatus(ev) !== "done")); }

/* ======================================================================
   5. HEADER / NEXT UP / PROGRESS
   ====================================================================== */
function renderHeader(){
  const t = todayDate();
  const iso = t.getFullYear() + "-" + pad2(t.getMonth()+1) + "-" + pad2(t.getDate());
  document.getElementById("header-date").textContent = formatROCDate(iso) + "（" + formatWeekdayFull(iso) + "）";
}

function renderFinalCountdown(){
  const days = calculateDaysRemaining(EXAM_TARGET);
  document.getElementById("hf-days").textContent = days > 0 ? days : (days === 0 ? "0" : "已結束");
}

function renderNextUp(){
  const nu = getNotDoneSorted()[0];
  if(!nu){
    document.getElementById("nu-title").textContent = "本學年重要行程已全部完成";
    document.getElementById("nu-date").textContent = "";
    document.getElementById("nu-week").textContent = "";
    document.getElementById("nu-time").textContent = "";
    document.getElementById("nu-badge").textContent = "";
    document.getElementById("nu-count").textContent = "";
    return;
  }
  const status = getEventStatus(nu);
  document.getElementById("nu-title").textContent = nu.title;
  document.getElementById("nu-date").textContent = formatROCDateRange(nu.start, nu.end);
  document.getElementById("nu-week").textContent = nu.noWeekday ? "" : formatWeekdayFull(nu.start);
  document.getElementById("nu-time").textContent = nu.time || "";
  const badge = document.getElementById("nu-badge");
  const col = statusBadgeStyle(status);
  badge.textContent = statusLabel(status);
  badge.style.background = col.bg;
  badge.style.color = col.fg;
  document.getElementById("nu-count").textContent =
    status === "today" ? "就在今天" : status === "ongoing" ? "進行中" : ("還有 " + calculateDaysRemaining(nu.start) + " 天");
}

function renderProgress(){
  const start = toDate(PREP_START).getTime();
  const end = toDate(PREP_END).getTime();
  const now = todayDate().getTime();
  const pct = Math.round(Math.max(0, Math.min(100, ((now - start) / (end - start)) * 100)));
  document.getElementById("pg-fill").style.width = pct + "%";
  document.getElementById("pg-pct").textContent = pct + "%";
}

/* ======================================================================
   6. 接下來（橫向捲動卡片）
   ====================================================================== */
function renderUpHscroll(){
  const list = getNotDoneSorted().slice(0, 6);
  const wrap = document.getElementById("up-hscroll");
  wrap.innerHTML = "";
  list.forEach(ev => {
    const status = getEventStatus(ev);
    const card = document.createElement("div");
    card.className = "up-card cat-" + ev.category;
    const week = ev.noWeekday ? "" : formatWeekdayShort(ev.start);
    const dday = status === "today" ? "TODAY" : status === "tomorrow" ? "明天" : status === "ongoing" ? "進行中" : ("還有" + calculateDaysRemaining(ev.start) + "天");
    card.innerHTML =
      '<div><div class="up-date">' + formatROCShort(ev.start) + '</div><div class="up-week">' + week + '</div></div>' +
      '<div class="up-title">' + ev.title + '</div>' +
      '<div class="up-dday">' + dday + '</div>';
    wrap.appendChild(card);
  });
}

/* ======================================================================
   7. 篩選 chips
   ====================================================================== */
const FILTERS = [
  { key:"all", label:"全部" },
  { key:"mock", label:"模擬考" },
  { key:"examMid", label:"段考" },
  { key:"final", label:"會考" },
  { key:"school", label:"校務／活動" },
  { key:"admin", label:"升學／行政" }
];
let currentFilter = "all";

function renderFilterChips(){
  const wrap = document.getElementById("filter-scroll");
  wrap.innerHTML = "";
  FILTERS.forEach(f => {
    const btn = document.createElement("button");
    btn.className = "chip" + (f.key === currentFilter ? " active" : "");
    btn.textContent = f.label;
    btn.addEventListener("click", () => {
      currentFilter = f.key;
      renderFilterChips();
      renderTimeline();
    });
    wrap.appendChild(btn);
  });
}

/* ======================================================================
   8. 時間軸（依月份分段，含 NOW 標記）
   ====================================================================== */
const TIMELINE_MONTHS = [
  { key:"2026-09", label:"9月",  year:2026 },
  { key:"2026-10", label:"10月", year:2026 },
  { key:"2026-11", label:"11月", year:2026 },
  { key:"2026-12", label:"12月", year:2026 },
  { key:"2027-01", label:"1月",  year:2027 },
  { key:"2027-02", label:"2月",  year:2027 },
  { key:"2027-03", label:"3月",  year:2027 },
  { key:"2027-04", label:"4月",  year:2027 },
  { key:"2027-05", label:"5月",  year:2027 }
];
function eventMonthKey(ev){
  const d = toDate(ev.start);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
}

function buildEvItem(ev){
  const status = getEventStatus(ev);
  const item = document.createElement("div");
  item.className = "ev-item cat-" + ev.category + (status === "done" ? " status-done" : "");
  const d = toDate(ev.start);
  const week = ev.noWeekday ? "" : formatWeekdayShort(ev.start);
  let sub = formatROCShort(ev.start) + (ev.end && ev.end !== ev.start ? "～" + formatROCShort(ev.end) : "");
  if(ev.time) sub += " ‧ " + ev.time;
  if(ev.datesList) sub += " ‧ 共" + ev.datesList.length + "日";
  item.innerHTML =
    '<div class="ev-datebox"><div class="d-num">' + d.getDate() + '</div><div class="d-mon">' + (d.getMonth()+1) + '月</div><div class="d-week">' + week + '</div></div>' +
    '<div class="ev-main">' +
      '<div class="ev-title">' + ev.title + '</div>' +
      '<div class="ev-sub">' + sub + '</div>' +
      '<div class="ev-foot"><span class="ev-cat">' + ev.categoryLabel + '</span><span class="ev-status">' + statusLabel(status) + '</span></div>' +
    '</div>';
  return item;
}

function renderTimeline(){
  const body = document.getElementById("timeline-body");
  body.innerHTML = "";

  const filtered = currentFilter === "all" ? events : events.filter(ev => ev.category === currentFilter);
  const sorted = sortByStart(filtered);

  const firstNotDoneId = (() => {
    const nd = sortByStart(events.filter(ev => getEventStatus(ev) !== "done"))[0];
    return nd ? nd.id : null;
  })();
  let nowInserted = false;

  TIMELINE_MONTHS.forEach(m => {
    const monthEvents = sorted.filter(ev => eventMonthKey(ev) === m.key);
    if(monthEvents.length === 0 && currentFilter !== "all") return;

    const block = document.createElement("div");
    block.className = "month-block";
    block.innerHTML = '<h3>' + m.label + '<span class="yr">' + toROCYear(m.year) + '年</span></h3>';

    if(!nowInserted && firstNotDoneId && monthEvents.some(ev => ev.id === firstNotDoneId)){
      const marker = document.createElement("div");
      marker.className = "now-marker";
      marker.id = "now-marker-anchor";
      marker.innerHTML = '<div class="now-tag">◆ 目前位置</div>';
      block.appendChild(marker);
      nowInserted = true;
    }

    if(monthEvents.length === 0){
      const empty = document.createElement("div");
      empty.style.cssText = "color:var(--ink-faint);font-size:12.5px;padding:4px 2px 10px 2px;";
      empty.textContent = "本月無列入之重大行程";
      block.appendChild(empty);
    } else {
      monthEvents.forEach(ev => block.appendChild(buildEvItem(ev)));
    }
    body.appendChild(block);
  });

  if(!nowInserted){
    const marker = document.createElement("div");
    marker.className = "now-marker";
    marker.id = "now-marker-anchor";
    marker.innerHTML = '<div class="now-tag">◆ 目前位置</div>';
    body.appendChild(marker);
  }
}

document.getElementById("jump-today-btn").addEventListener("click", () => {
  const anchor = document.getElementById("now-marker-anchor");
  if(anchor) anchor.scrollIntoView({ behavior:"smooth", block:"center" });
});

/* ======================================================================
   9. 考試總表
   ====================================================================== */
function buildExamChip(ev){
  const status = getEventStatus(ev);
  const chip = document.createElement("div");
  chip.className = "exam-chip" + (status === "done" ? " status-done" : "");
  chip.innerHTML =
    '<div class="ec-title">' + ev.title + '</div>' +
    '<div class="ec-date">' + formatROCDateRange(ev.start, ev.end) + '</div>';
  return chip;
}

function renderExamSummary(){
  const mockRow = document.getElementById("exam-mock-row");
  const mid1Row = document.getElementById("exam-mid1-row");
  const mid2Row = document.getElementById("exam-mid2-row");
  mockRow.innerHTML = ""; mid1Row.innerHTML = ""; mid2Row.innerHTML = "";

  sortByStart(events.filter(ev => ev.category === "mock")).forEach(ev => mockRow.appendChild(buildExamChip(ev)));

  const mid = sortByStart(events.filter(ev => ev.category === "examMid"));
  mid.filter(ev => toDate(ev.start) < toDate("2027-02-01")).forEach(ev => mid1Row.appendChild(buildExamChip(ev)));
  mid.filter(ev => toDate(ev.start) >= toDate("2027-02-01")).forEach(ev => mid2Row.appendChild(buildExamChip(ev)));

  const finalEv = events.find(ev => ev.category === "final");
  document.getElementById("final-block").innerHTML =
    '<div class="fb-tag">FINAL</div>' +
    '<div class="fb-title">' + finalEv.title + '</div>' +
    '<div class="fb-date">' + formatROCDateRange(finalEv.start, finalEv.end) + '</div>';
}

/* ======================================================================
   INIT
   ====================================================================== */
(function init(){
  renderHeader();
  renderFinalCountdown();
  renderNextUp();
  renderProgress();
  renderUpHscroll();
  renderFilterChips();
  renderTimeline();
  renderExamSummary();

  setInterval(() => {
    renderHeader();
    renderFinalCountdown();
    renderNextUp();
    renderProgress();
  }, 60000);
})();
</script>
</body>
</html>
